name: reviewer-study
# Research run for the AI reviewer study. Only runs on the study branch.
on:
  push:
    branches: [study/reviewers]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: can this token read other public repos?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/getsentry/sentry/pulls/1/reviews --jq length && gh api rate_limit --jq .resources.core
      - name: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORDER: reverse
        run: python3 scripts/study/collect.py scripts/study/sample.json results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewer-study-results-reverse
          path: results.jsonl
          retention-days: 7
