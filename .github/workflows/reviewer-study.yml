name: reviewer-study
# Research run for the AI reviewer study. Only runs on the study branch.
# This step collects the finished results, encrypts them to the study's
# public key (raw review text is never published) and commits the ciphertext.
on:
  push:
    branches: [study/reviewers]
permissions:
  contents: write
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reviewer-study-results
          run-id: 39812745488
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: a
      - uses: actions/download-artifact@v4
        with:
          name: reviewer-study-results-reverse
          run-id: 39812867294
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: b
      - name: encrypt and commit
        run: |
          cat a/results.jsonl b/results.jsonl > all.jsonl
          wc -l all.jsonl
          gzip -9 all.jsonl
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in all.jsonl.gz -out scripts/study/results.enc -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey scripts/study/pub.pem -pkeyopt rsa_padding_mode:oaep -in k.bin -out scripts/study/results.key.enc
          rm k.bin all.jsonl.gz
          git config user.name "cowboy-study"
          git config user.email "study@users.noreply.github.com"
          git add scripts/study/results.enc scripts/study/results.key.enc
          git commit -m "Reviewer study: encrypted results"
          git push
