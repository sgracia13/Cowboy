# Three ways to release:
#   - change the VERSION file on main (e.g. to v0.1.1) and push
#   - push a tag:  git tag v0.1.0 && git push origin v0.1.0
#   - or on GitHub: Actions > release > Run workflow, and type the version
# The workflow creates the tag if it doesn't exist yet.
# Builds the downloads, publishes a GitHub release with checksums and the
# install script, and pushes the Docker image to ghcr.io.
name: release
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0-preview"
        required: true
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pick the version
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then
            if [ "${{ github.ref_type }}" = tag ]; then v="${{ github.ref_name }}"; else v="$(tr -d ' \n' < VERSION)"; fi
          fi
          case "$v" in v*) ;; *) echo "version must start with v, got '$v'"; exit 1 ;; esac
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go vet ./... && go test ./...
      - name: build downloads
        run: make dist VERSION="$VERSION"
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then echo "release $VERSION already exists"; exit 0; fi
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "$VERSION" dist/* $pre --target "$GITHUB_SHA" \
            --title "cowboy $VERSION" --notes-file - <<'NOTES'
          ## install

          ```sh
          curl -fsSL https://github.com/sgracia13/Cowboy/releases/latest/download/install.sh | sh
          cowboy demo
          ```

          Or run it with Docker:

          ```sh
          docker run -p 8080:8080 -v cowboy-data:/data \
            -e FORGE_TOKEN=... -e WEBHOOK_SECRET=... -e UI_PASSWORD=... \
            ghcr.io/sgracia13/cowboy:latest
          ```

          Windows: download `cowboy-windows-amd64.exe` below. macOS builds are not signed yet; the install script clears the quarantine flag for you.

          Checksums for every file are in `SHA256SUMS`.
          NOTES
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pick the version
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then
            if [ "${{ github.ref_type }}" = tag ]; then v="${{ github.ref_name }}"; else v="$(tr -d ' \n' < VERSION)"; fi
          fi
          case "$v" in v*) ;; *) echo "version must start with v, got '$v'"; exit 1 ;; esac
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/sgracia13/cowboy:${{ env.VERSION }}
            ghcr.io/sgracia13/cowboy:latest
