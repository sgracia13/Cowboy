name: reviewer-study
# Research run for the AI reviewer study. Only runs on the study branch.
on:
  push:
    branches: [study/reviewers]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/study/collect.py scripts/study/sample.json results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewer-study-results
          path: results.jsonl
          retention-days: 7
